<style>
  /* 视觉基调:宣纸为底、墨色为文、黛蓝为骨、赭石为流——书卷气的单文件知识树。
     装饰全部 CSS 自绘(纸纹、针点阵、菱形饰、双线书脊),零外部资源。 */
  :root{
    --paper:#F4EEE0; --paper2:#FCF9F0; --paper3:#F2ECDC;   /* 宣纸三档 */
    --ink:#2C2A25; --soft:#6E6656;                          /* 墨与淡墨 */
    --dai:#2E4A5F; --dai-mid:#5F7C8F; --dai-light:#DCE5EB;  /* 黛蓝三档 */
    --line:#C9BEA3;                                          /* 纸边线 */
    --amber:#C08A3E; --seal:#A63A2B;                         /* 赭石(流转)/朱砂(印) */
    --serif:Georgia,"Times New Roman","Songti SC","STSong",SimSun,serif;
    --sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{display:flex; flex-direction:column; color:var(--ink); font:14px/1.7 var(--sans);
       background-color:var(--paper);
       background-image:repeating-linear-gradient(0deg, rgba(120,100,60,.03) 0, rgba(120,100,60,.03) 1px, transparent 1px, transparent 7px)}
  header{display:flex; align-items:center; gap:2px; flex-wrap:wrap;
         padding:4px 14px; background:var(--paper2); border-bottom:3px double var(--line)}
  .brand{display:flex; align-items:center; gap:9px; margin-right:auto;
         font:700 17px/1.3 var(--serif); color:var(--dai); letter-spacing:.5px}
  .brand::before{content:""; flex:none; width:12px; height:12px; border-radius:3px;
         border:2.2px solid var(--dai); transform:rotate(45deg)}
  .brand small{color:var(--soft); font:400 12px/1 var(--sans); letter-spacing:0}
  button{min-height:42px; border:1px solid var(--line); background:var(--paper2); color:var(--dai);
         border-radius:7px; padding:8px 14px; cursor:pointer; font:600 13px/1.4 var(--sans);
         box-shadow:0 1px 0 rgba(80,65,35,.14);
         transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease}
  button:hover{background:var(--dai-light); border-color:var(--dai-mid)}
  button:active{box-shadow:none}
  button.primary{background:var(--dai); border-color:var(--dai); color:#FDFCF7}
  button.primary:hover{background:#223A4C; border-color:#223A4C}
  button.danger{color:var(--seal); border-color:#D9B7AE}
  button.danger:hover{background:#F7E9E4; border-color:var(--seal)}
  label.toggle{min-height:42px; padding:0 4px; font-size:13px; color:var(--dai);
         display:flex; align-items:center; gap:5px; cursor:pointer}
  label.toggle input{width:16px; height:16px; accent-color:var(--dai)}
  /* 顶栏去"按钮墙":默认幽灵化(无边无影如菜单字),hover 才落纸面,只留主钮一枚实心 */
  header button{border-color:transparent; background:transparent; box-shadow:none; padding:8px 11px;
         flex:none; white-space:nowrap}   /* flex:none:窄屏整体换行,禁止压缩溢出 */
  .brand{flex:none}
  header button:hover{background:var(--paper3); border-color:transparent}
  header button:active{background:var(--dai-light)}
  header button.primary{background:var(--dai); border-color:var(--dai); color:#FDFCF7; margin-left:6px}
  header button.primary:hover{background:#223A4C; border-color:#223A4C}
  #app{flex:1; position:relative; overflow:hidden}
  #canvas{position:absolute; inset:0; cursor:grab; touch-action:none;
          background-image:radial-gradient(rgba(46,74,95,.075) 1px, transparent 1.4px);
          background-size:26px 26px}
  #canvas:active{cursor:grabbing}
  #canvas svg{width:100%; height:100%; display:block}
  #zoomer{position:absolute; right:14px; bottom:18px; display:flex; flex-direction:column; gap:9px; z-index:4}
  #zoomer button{width:44px; height:44px; min-height:44px; padding:0; border-radius:50%;
          font-size:20px; line-height:1; background:var(--paper2); color:var(--dai);
          box-shadow:0 2px 7px rgba(60,50,30,.24)}
  #zoomer button:hover{background:var(--dai-light)}
  footer{padding:5px 14px; text-align:center; font-size:11px; color:var(--soft);
         background:var(--paper2); border-top:3px double var(--line)}
  .nlab{width:100%; height:100%; display:flex; align-items:center; gap:5px; padding:0 9px;
        font:13px/1.4 var(--serif); overflow:hidden; white-space:nowrap}
  .nlab .t{overflow:hidden; text-overflow:ellipsis}
  .nlab .t[data-title-editing]{overflow:visible; background:var(--paper2); color:var(--dai);
        outline:1.5px solid var(--amber); border-radius:3px; padding:0 2px; cursor:text}
  .nlab .b{flex:none; font:700 10px/1.6 var(--sans); letter-spacing:.5px; border-radius:4px; padding:0 4px}
  /* 入场动效:一次性、不循环,不拖累触屏拖拽/捏合 */
  @keyframes panelIn{from{transform:translateX(16px); opacity:0} to{transform:none; opacity:1}}
  @keyframes modalIn{from{transform:translateY(8px) scale(.985); opacity:0} to{transform:none; opacity:1}}
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  /* 侧栏 */
  .panel{position:absolute; top:0; right:0; bottom:0; width:min(400px,92vw); background:var(--paper2);
         border-left:1px solid var(--line); box-shadow:-8px 0 22px rgba(60,48,25,.15);
         padding:18px 20px; overflow-y:auto; z-index:5; animation:panelIn .18s ease-out}
  .panel h2{font:700 18px/1.5 var(--serif); color:var(--dai); margin-bottom:2px;
         border-bottom:1px solid var(--dai-light); padding-bottom:6px}
  .panel .meta{font-size:12px; color:var(--soft); margin:6px 0 10px}
  .panel .sec{margin:12px 0}
  .panel .sec h3{font:600 12.5px/1.5 var(--serif); color:var(--soft); letter-spacing:2px; margin-bottom:4px}
  .panel .core{font-family:var(--serif); font-size:14.5px; white-space:pre-wrap}
  .box{background:var(--paper3); border:1px solid var(--line); border-radius:8px; padding:9px 11px;
       font:13px/1.7 var(--serif); white-space:pre-wrap}
  .chips{display:flex; flex-wrap:wrap; gap:6px}
  .chips span{background:var(--paper2); border:1px solid var(--line); color:var(--dai);
       border-radius:11px; padding:1px 10px; font-size:12px}
  .btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
  .btnrow button{flex:none}
  .plink{color:var(--dai-mid); cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px}
  .plink:hover{color:var(--dai)}
  .panel input[type=text], .panel select, .panel textarea{
     width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 9px;
     font:13px/1.6 var(--sans); color:var(--ink); background:#FFFDF8}
  .panel textarea{min-height:74px; resize:vertical; font-family:var(--serif)}
  .panel input:focus-visible, .panel select:focus-visible, .panel textarea:focus-visible,
  .modal input:focus-visible{outline:2px solid rgba(95,124,143,.45); outline-offset:1px; border-color:var(--dai-mid)}
  .panel .f{margin-bottom:9px}
  .panel .f label{display:block; font-size:12px; color:var(--soft); margin-bottom:2px}
  /* 卡篮 */
  .basket{position:absolute; top:0; right:0; bottom:0; width:min(430px,94vw); background:var(--paper2);
          border-left:1px solid var(--line); box-shadow:-8px 0 22px rgba(60,48,25,.17);
          display:flex; flex-direction:column; z-index:6; animation:panelIn .18s ease-out}
  .basket .hd{display:flex; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line)}
  .basket .hd b{font-family:var(--serif); color:var(--dai); margin-right:auto}
  .basket .ls{flex:1; overflow-y:auto; padding:12px 16px}
  .bitem{border:1px solid var(--line); border-radius:9px; padding:9px 12px; margin-bottom:10px;
         background:var(--paper3); box-shadow:0 1px 2px rgba(80,65,35,.09)}
  .bitem b{font-family:var(--serif); color:var(--dai); font-size:13.5px}
  .bitem p{font-size:12.5px; color:#57534A; margin:3px 0 7px; font-family:var(--serif)}
  .basket .ft{display:flex; gap:8px; padding:11px 16px; border-top:1px solid var(--line)}
  /* 弹窗 */
  .mask{position:absolute; inset:0; background:rgba(44,42,37,.34); z-index:8;
        display:flex; align-items:center; justify-content:center; animation:fadeIn .15s ease-out}
  .modal{background:var(--paper2); border:1px solid var(--line); border-top:4px solid var(--dai);
         border-radius:10px; width:min(560px,92vw); max-height:86%; overflow-y:auto;
         padding:22px 26px; box-shadow:0 14px 44px rgba(40,33,18,.3); animation:modalIn .16s ease-out}
  .modal h2{font:700 17px/1.5 var(--serif); color:var(--dai); margin-bottom:10px;
         border-bottom:1px solid var(--dai-light); padding-bottom:7px}
  .modal .f{margin-bottom:10px}
  .modal .f label{display:block; font-size:12px; color:var(--soft); margin-bottom:2px}
  .modal input[type=text], .modal input[type=password]{
         width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 9px;
         font:13px/1.6 var(--sans); color:var(--ink); background:#FFFDF8}
  .modal .note{font-size:12px; color:var(--soft); line-height:1.8}
  .modal table{width:100%; border-collapse:collapse; font-size:12px; margin:6px 0}
  .modal td,.modal th{border:1px solid var(--line); padding:4px 8px; text-align:left}
  .modal th{background:var(--dai-light); color:var(--dai)}
  .ok{background:#EDF3E9; border:1px solid #C6DABF; color:#35603F; border-radius:8px; padding:10px 13px; font-size:13px; margin-top:10px}
  .legal{font-size:11.5px; color:#8B8371; line-height:1.9; margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
  /* 手机竖屏:顶栏收紧到两行内、面板全宽、页脚缩字 */
  @media (max-width:600px){
    header{padding:3px 8px}
    .brand{font-size:15px; gap:6px}
    .brand small{font-size:11px}
    header button{min-height:36px; padding:5px 8px; font-size:12px}
    header button.primary{margin-left:2px; padding:5px 10px}
    button{min-height:38px}
    .btnrow{gap:6px}
    .btnrow button{padding:7px 10px; font-size:12.5px}
    #zoomer{right:10px; bottom:12px; gap:7px}
    #zoomer button{width:40px; height:40px; min-height:40px; font-size:18px}
    .panel{width:100vw; border-left:none; padding:14px 16px}
    .basket{width:100vw; border-left:none}
    .modal{width:94vw; padding:16px 16px; max-height:90%}
    footer{font-size:9.5px; line-height:1.55; padding:3px 8px}
  }
  @media (prefers-reduced-motion:reduce){
    .panel,.basket,.mask,.modal{animation:none}
    button{transition:none}
  }
button:disabled{opacity:.4;cursor:default}
#dragghost{position:fixed;z-index:99;pointer-events:none;background:#FCF9F1;border:1.5px dashed #B57A2E;
  border-radius:7px;padding:4px 10px;font:13px/1.4 Georgia,"Songti SC",serif;color:#2E4A5F;
  box-shadow:0 4px 12px rgba(60,48,25,.25);max-width:220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
</style>

var LANG = "zh";
try{ LANG = (localStorage.getItem("notetree_lang") === "en") ? "en" : "zh"; }catch(e){}
function T(key){
  var d = I18N[LANG] || I18N.zh;
  return (d[key] != null) ? d[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
}
/* 顶栏等静态 DOM 当场更新;动态渲染的面板/弹窗在下次打开时自然生效 */
function applyLang(){
  document.getElementById("btn-fit").textContent = T("btnFit");
  var lt = document.getElementById("lbl-hidden");
  if(lt && lt.lastChild) lt.lastChild.nodeValue = T("showHidden");
  document.getElementById("btn-basket").innerHTML = T("basket")+' (<span id="basket-n">'+state.basket.length+'</span>)';
  document.getElementById("btn-mount").textContent = T("btnMount");
  document.getElementById("btn-import").textContent = T("ioTitle");
  document.getElementById("btn-publish").textContent = state.dirty ? T("saveNewDirty") : T("saveNew");
  document.getElementById("btn-about").textContent = T("about");
  document.getElementById("btn-lang").textContent = (LANG === "zh") ? "EN" : "中文";
  document.title = ((state.data && state.data.meta && state.data.meta.name) || "知识树") + T("titleSuffix");
}
/* ============ 状态 ============ */
var island = document.getElementById("tree-data");
var state = {
  data: null, byId: {}, childs: {},
  collapsed: {}, showHidden: false,
  basket: [], selected: null, editing: false,
  view: {x: 40, y: 40, k: 1}, dirty: false,
  lastLayout: null
};
try { state.data = JSON.parse(island.textContent); }
catch(e){ uiAlert(T("dataParseFail") + e.message); state.data = {meta:{version:0,changelog:[]},cards:[]}; }
/* 网页壳模式(http/https 打开,如 GitHub Pages 托管):树数据缓存在本机浏览器
   localStorage,不上传任何服务器;iPad 零安装用法的基础。file:// 双击打开不受影响。 */
var hostedMode = /^https?:$/.test(location.protocol);   /* 分发形态恒为 file://:托管壳代码保留,但不随分发启用、不在文档承诺 */
if(hostedMode){
  try{
    var _tc = localStorage.getItem("notetree_treecache");
    if(_tc && state.data.cards.length <= 1){   /* 数据岛是空树才吃缓存,不覆盖真数据 */
      var _td = JSON.parse(_tc);
      if(_td && _td.meta && Array.isArray(_td.cards) && _td.cards.length) state.data = _td;
    }
  }catch(e){}
}

function index(){

  if(!state.byId.root){ cards.unshift({id:"root",parent:"",stage:"",title:state.data.meta.name||"知识树",core:""}); state.byId.root=cards[0]; }

/* ============ 布局 ============ */
function layout(){
  var pos = {}, edges = [], refEdges = [];
  function span(id){
    if(state.collapsed[id]) return NW;
    var ks = visKids(id);
    if(!ks.length) return NW;
    var s = 0;
    for(var i=0;i<ks.length;i++){ s += span(ks[i]); if(i) s += GAP; }
    return Math.max(NW, s);
  }
  function place(id, cx, depth){
    pos[id] = {x:cx, y:depth*LEVEL_H};
    if(state.collapsed[id]) return;
    var ks = visKids(id);
    if(!ks.length) return;
    var total = 0, ws = [], i;
    for(i=0;i<ks.length;i++){ ws.push(span(ks[i])); total += ws[i]; if(i) total += GAP; }
    var x = cx - total/2;
    for(i=0;i<ks.length;i++){
      var c = x + ws[i]/2;
      edges.push([id, ks[i]]);
      place(ks[i], c, depth+1);
      x += ws[i] + GAP;
    }
  }
  place("root", 0, 0);
  for(var id in pos){
    var r = state.byId[id].refines;
    while(r && !pos[r]) r = (state.byId[r] || {}).parent;   /* 目标被折叠:画到其可见祖先 */
    if(r && pos[r] && r !== state.byId[id].parent && r !== id) refEdges.push([r, id]);
  }
  state.lastLayout = {pos:pos, edges:edges, refEdges:refEdges};
  return state.lastLayout;
}

    s.push('<path d="M'+ra.x+','+ry1+' C'+(ra.x+30)+','+(ra.y+70)+' '+(rb.x-30)+','+(rb.y-70)+' '+rb.x+','+ry2+'" fill="none" stroke="url(#rg'+i+')" stroke-width="2.6" stroke-dasharray="6 4" opacity="0.95" marker-end="url(#arrR)"/>');
  }

          rect.setAttribute("stroke-width", rect.getAttribute("data-sw") || "1.3"); }
  }
  function ndragPlace(x, y){ if(ndrag && ndrag.ghost){ ndrag.ghost.style.left = (x+14)+"px"; ndrag.ghost.style.top = (y+14)+"px"; } }
  function ndragStart(){
    if(!ndrag || ndrag.active) return;
    ndrag.active = true; moved = true;
    var g = cv.querySelector('[data-id="'+CSS.escape(ndrag.id)+'"]');
    if(g) g.setAttribute("opacity", "0.35");
    var gh = document.createElement("div");
    gh.id = "dragghost";
    gh.textContent = (state.byId[ndrag.id] || {}).title || "";
    document.body.appendChild(gh);
    ndrag.ghost = gh;
    ndragPlace(ndrag.sx, ndrag.sy);
  }
  function ndragMove(e){
    ndragPlace(e.clientX, e.clientY);
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var g = el && el.closest ? el.closest("[data-id]") : null;
    var tid = g ? g.getAttribute("data-id") : null;
    if(!validParent(ndrag.id, tid)) tid = null;
    if(tid !== ndrag.hover){ hlNode(ndrag.hover, false); ndrag.hover = tid; hlNode(tid, true); }
  }
  function ndragEnd(){
    var id = ndrag.id, tid = ndrag.hover;
    if(ndrag.timer) clearTimeout(ndrag.timer);
    if(ndrag.ghost) ndrag.ghost.remove();
    hlNode(tid, false);
    ndrag = null;
    if(tid && validParent(id, tid) !== false && state.byId[id] && state.byId[tid]){
      snapshot();
      state.byId[id].parent = tid;
      delete state.collapsed[tid];
      markDirty(); index(); select(id); renderTree(); renderUI();
    } else {
      renderTree();   /* 取消:重绘清掉半透明 */
    }
  }
  function ndragCancel(){
    if(!ndrag) return;
    if(ndrag.timer) clearTimeout(ndrag.timer);
    if(ndrag.active){ hlNode(ndrag.hover, false); if(ndrag.ghost) ndrag.ghost.remove(); renderTree(); }
    ndrag = null;
  }
  var pts = {};                        /* pointerId -> {x,y}:活动指针,触屏多指 */
  var swallowClick = false;            /* 结束就地改名的那次点击,不再触发选中/折叠 */
  var pinch = null;                    /* {d0,k0,x0,y0,cx,cy}:双指捏合基准 */
  var lastTap = {t: 0, x: 0, y: 0};    /* double-tap 检测(触屏没有可靠 dblclick) */
  function ptCount(){ var n=0,k; for(k in pts) n++; return n; }
  cv.addEventListener("pointerdown", function(e){
    if(titleEditing){
      var hit = document.elementFromPoint(e.clientX, e.clientY) || e.target;
      if(hit && hit.closest && hit.closest("[data-title-editing]")) return; /* 事件让给文本编辑 */
      finishTitleEdit(true);   /* 点别处 = 保存;本次按下不启动拖拽 */
      swallowClick = true;
      return;
    }
    pts[e.pointerId] = {x: e.clientX, y: e.clientY};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    if(ptCount() === 2){
      var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
      pinch = {d0: Math.hypot(a.x-b.x, a.y-b.y) || 1, k0: state.view.k,
               x0: state.view.x, y0: state.view.y,
               cx: (a.x+b.x)/2, cy: (a.y+b.y)/2};
      drag = null; moved = true;       /* 进入双指后,这一轮不再算点击 */
      ndragCancel();                   /* 捏合优先,取消拖拽换父 */
    } else if(ptCount() === 1){
      drag = {x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y};
      moved = false;
      /* 拖拽换父候选:按在节点上(非 root)。桌面拖动超阈值进入;触屏长按 450ms 进入 */
      var hit0 = document.elementFromPoint(e.clientX, e.clientY);
      var g0 = hit0 && hit0.closest ? hit0.closest("[data-id]") : null;
      var id0 = g0 ? g0.getAttribute("data-id") : null;
      if(id0 && id0 !== "root"){
        ndrag = {id: id0, active: false, hover: null, timer: null,
                 sx: e.clientX, sy: e.clientY, mouse: (e.pointerType === "mouse"), ghost: null};
        if(!ndrag.mouse){
          ndrag.timer = setTimeout(function(){
            if(ndrag && !ndrag.active && !moved && ptCount() === 1) ndragStart();
          }, 450);
        }
      } else { ndrag = null; }
    }
  });
  cv.addEventListener("pointermove", function(e){
    if(!pts[e.pointerId]) return;
    pts[e.pointerId] = {x: e.clientX, y: e.clientY};
    if(pinch && ptCount() >= 2){       /* 双指:捏合缩放 + 中点平移 */
      var ids = Object.keys(pts), a = pts[ids[0]], b = pts[ids[1]];
      var d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      var cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
      var k2 = Math.min(KMAX, Math.max(KMIN, pinch.k0 * d / pinch.d0));
      var r = cv.getBoundingClientRect();
      var mx = pinch.cx - r.left, my = pinch.cy - r.top;
      state.view.x = mx - (mx - pinch.x0) * k2 / pinch.k0 + (cx - pinch.cx);
      state.view.y = my - (my - pinch.y0) * k2 / pinch.k0 + (cy - pinch.cy);
      state.view.k = k2;
      applyTf();
      return;
    }
    if(!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(ndrag && !ndrag.active){
      if(ndrag.mouse && Math.abs(dx) + Math.abs(dy) > 6){ ndragStart(); }
      else if(!ndrag.mouse && Math.abs(dx) + Math.abs(dy) > 10){ ndragCancel(); }  /* 触屏滑动 = 平移 */
    }
    if(ndrag && ndrag.active){ ndragMove(e); return; }   /* 拖节点时画布不平移 */
    if(Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    if(moved){ state.view.x = drag.vx + dx; state.view.y = drag.vy + dy; applyTf(); }
  });
  function endPointer(e){
    delete pts[e.pointerId];
    if(ptCount() < 2) pinch = null;
  }
  cv.addEventListener("pointercancel", function(e){ endPointer(e); ndragCancel(); });
  cv.addEventListener("pointerup", function(e){
    endPointer(e);
    if(ndrag && ndrag.active){ ndragEnd(); drag = null; moved = false; return; }
    ndragCancel();
    if(swallowClick){ swallowClick = false; drag = null; return; }
    if(titleEditing){ drag = null; return; }   /* 就地改名进行中:抬起不跑树命中 */
    if(moved){ drag = null; return; }
    drag = null;
    /* setPointerCapture 生效后 pointerup 的 e.target 被改写成 canvas 本身,
       点了哪个节点的信息就丢了(自动化测试里 capture 抛错失效,反而测不出)。
       用抬起坐标重新求真实命中元素。 */
    var tgt = document.elementFromPoint(e.clientX, e.clientY) || e.target;
    var gEl = tgt.closest ? tgt.closest("[data-id]") : null;
    var chipEl = tgt.closest ? tgt.closest("[data-chip]") : null;
    /* double-tap(两次快速轻点同处)= 双击改名:触屏没有可靠 dblclick */
    var now = Date.now();
    if(now - lastTap.t < 400 && Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 30){
      lastTap = {t: 0, x: 0, y: 0};
      var lab = tgt.closest ? tgt.closest(".nlab") : null;
      if(lab && gEl){
        var sp = lab.querySelector(".t");
        if(sp){ startTitleEdit(gEl.getAttribute("data-id"), sp); return; }
      }
    } else {
      lastTap = {t: now, x: e.clientX, y: e.clientY};
    }
    /* 命中优先级:精确点中圆片 > 点中节点 > 落点附近就近容差找圆片 > 空白 */
    var cid = chipEl ? chipEl.getAttribute("data-chip") : (gEl ? null : nearestChipId(e));
    if(cid){
      if(state.collapsed[cid]) delete state.collapsed[cid]; else state.collapsed[cid]=1;
      renderTree(); return; }
    if(gEl){ select(gEl.getAttribute("data-id")); }
    else { select(null); }
  });
  function nearestChipId(e){
    var L = state.lastLayout;
    if(!L) return null;
    var r = cv.getBoundingClientRect();
    var wx = (e.clientX - r.left - state.view.x) / state.view.k;
    var wy = (e.clientY - r.top - state.view.y) / state.view.k;
    var best = null, bestD = Infinity, id;
    for(id in L.pos){
      if(!(state.childs[id]||[]).length) continue;
      var dx = wx - L.pos[id].x, dy = wy - (L.pos[id].y + NH/2 + 11);
      var d = dx*dx + dy*dy;
      if(d < bestD){ bestD = d; best = id; }
    }
    var tol = Math.max(11, Math.min(18 / state.view.k, 90));
    return (best && bestD <= tol * tol) ? best : null;
  }
  cv.addEventListener("wheel", function(e){
    if(titleEditing) return;   /* 就地改名期间不抢缩放 */
    e.preventDefault();
    var k2 = Math.min(KMAX, Math.max(KMIN, state.view.k * Math.pow(1.0015, -e.deltaY)));
    var r = cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    state.view.x = mx - (mx-state.view.x)*k2/state.view.k;
    state.view.y = my - (my-state.view.y)*k2/state.view.k;
    state.view.k = k2; applyTf();
  }, {passive:false});
  function zoomBy(f){
    var r = cv.getBoundingClientRect(), mx = r.width/2, my = r.height/2;
    var k2 = Math.min(KMAX, Math.max(KMIN, state.view.k * f));
    state.view.x = mx - (mx - state.view.x) * k2 / state.view.k;
    state.view.y = my - (my - state.view.y) * k2 / state.view.k;
    state.view.k = k2; applyTf();
  }
  document.getElementById("z-in").addEventListener("click", function(){ zoomBy(1.3); });
  document.getElementById("z-out").addEventListener("click", function(){ zoomBy(0.77); });
}

/* ---- 跨端携带(口令加密):PBKDF2-SHA256 派生 AES-GCM-256,密文存 meta.enc_key 随 selfSave 走。
   明文 key 永不进 meta/数据岛/保存的文件——只存密文;解密结果只进内存与 localStorage。 ---- */
var ENC_ITER = 310000;
function encSupported(){   /* 某些 App 内 WebView 没有 crypto.subtle:不可用时优雅降级,不崩 */
  try{ return !!(window.crypto && crypto.subtle && crypto.subtle.importKey && crypto.getRandomValues); }
  catch(e){ return false; }
}
function b64enc(buf){
  var u8=new Uint8Array(buf), s="";
  for(var i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]);
  return btoa(s);
}
function b64dec(s){
  var bin=atob(s), u8=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8;
}
function encDerive(pass, salt, iter){
  return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function(km){
      return crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:salt, iterations:iter},
        km, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
    });
}
function encKeyEncrypt(pass, plain){
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  return encDerive(pass, salt, ENC_ITER).then(function(ak){
    return crypto.subtle.encrypt({name:"AES-GCM", iv:iv}, ak, new TextEncoder().encode(plain));
  }).then(function(ct){
    return {v:1, salt:b64enc(salt), iv:b64enc(iv), iter:ENC_ITER, ct:b64enc(ct)};
  });
}
function encKeyDecrypt(pass, rec){   /* 口令错误或密文损坏均走 reject,由调用方报"口令不对" */
  return Promise.resolve().then(function(){
    return encDerive(pass, b64dec(rec.salt), rec.iter||ENC_ITER);
  }).then(function(ak){
    return crypto.subtle.decrypt({name:"AES-GCM", iv:b64dec(rec.iv)}, ak, b64dec(rec.ct));
  }).then(function(pt){ return new TextDecoder().decode(pt); });
}

/* 端点只认两家官方平台。主机名在闭包内由字符码拼装(源码里不出现明文域名),
   拼出后按校验和自检:主机被改写(例如指向境外端点)→ 校验失败 → base 置空 →
   请求在网络层发不出去。既不提供自定义地址入口,也不给"搜索替换一行域名"留口子。 */

var EP_MAP = {
  kimi: { h: [97,112,105,46,109,111,111,110,115,104,111,116,46,99,110],        p: "/v1",           ck: 1502 },
  glm:  { h: [111,112,101,110,46,98,105,103,109,111,100,101,108,46,99,110],     p: "/api/paas/v4",  ck: 1570 }
};
function epBase(p){
  var e = EP_MAP[p] || EP_MAP.kimi, host = epAsm(e.h), sum = 0, i;
  for(i = 0; i < host.length; i++){ sum += host.charCodeAt(i); }
  if(sum !== e.ck || !/^[a-z]+\.[a-z]+\.[a-z]{2,4}$/.test(host)){ return ""; }  /* 主机被篡改 → 空 */

function download(content, fname, mime){
  var type=(mime||"application/octet-stream")+";charset=utf-8";
  var blob=new Blob([content],{type:type});
  if(isAppleTouch() && navigator.canShare){
    try{
      /* 用通用类型分享:text/html 会被微信等 App 的接收器拒收而不出现在面板里 */
      var f=new File([blob], fname, {type:"application/octet-stream"});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f]}).catch(function(){
          /* 面板被取消/失败(如找不到想发的 App)→ 回落浏览器直接下载:
             Safari/Edge 完整浏览器里 blob 下载进下载列表,可再从那里分享 */
          var a2=document.createElement("a"); a2.href=URL.createObjectURL(blob); a2.download=fname;
          document.body.appendChild(a2); a2.click();
          setTimeout(function(){ URL.revokeObjectURL(a2.href); a2.remove(); }, 800);
        });
        return;
      }
    }catch(e){}   /* File 构造或 share 不可用 → 回落 blob 下载 */
  }
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
}

/* ============ 导入 / 导出 ============ */
function sanitizeCards(arr){
  /* 导入防御:类型强制、长度上限、危险 id 拒绝(原型链污染/选择器崩溃)、卡数上限 */
  var out = [], i, c, id, seenIds = {};
  for(i = 0; i < arr.length && out.length < 4000; i++){
    c = arr[i]; if(!c || typeof c !== "object") continue;
    id = String(c.id == null ? "" : c.id).slice(0, 80);
    if(!id || id === "__proto__" || id === "constructor" || id === "prototype") continue;
    if(seenIds[" " + id]) continue;   /* 重复 id 拒收:防"双份同 id"骗过可达性检测 */
    seenIds[" " + id] = 1;
    c.id = id;
    c.parent = String(c.parent == null ? "" : c.parent).slice(0, 80);
    if(c.parent === "__proto__" || c.parent === "constructor" || c.parent === "prototype") c.parent = "root";
    if(c.refines != null){
      c.refines = String(c.refines).slice(0, 80);
      if(c.refines === "__proto__" || c.refines === "constructor" || c.refines === "prototype") c.refines = "";
    }
    c.title = String(c.title == null ? "" : c.title).slice(0, 200);
    if(c.brief != null) c.brief = String(c.brief).slice(0, 4000);
    if(c.core != null) c.core = String(c.core).slice(0, 20000);
    if(c.hidden != null) c.hidden = c.hidden === true;   /* 只认布尔真 */
    out.push(c);
  }
  return out;
}
function importText(txt){
  if(txt.indexOf('id="tree-data"') > -1){   /* 整份树文件 → 载入整树(网页壳模式) */
    var mm = txt.match(/<script type="application\/json" id="tree-data">([\s\S]*?)<\/script>/);
    var td = null;
    try{ td = mm ? JSON.parse(mm[1]) : null; }catch(e){}
    if(!td || !td.meta || !Array.isArray(td.cards)){ uiAlert(T("noTreeData")); return; }
    td.cards = sanitizeCards(td.cards);
    td.meta.version = +td.meta.version || 0;
    td.meta.name = String(td.meta.name == null ? "" : td.meta.name).slice(0, 80);
    var doLoadTree = function(){
      if(!hostedMode){
        /* 本地文件模式:直接载入整树(壳升级的正道——新壳打开旧树文件即可迁移) */
        snapshot();
        state.data = td;
        state.selected = null; state.editing = false; state.basket = [];
        index(); markDirty(); renderTree(); renderUI(); renderBasket(); applyAiUI(); fit();
        var bn0 = document.getElementById("basket-n"); if(bn0) bn0.textContent = "0";
        uiAlert(T("loadedOk"));
        return;
      }
      try{ localStorage.setItem("notetree_treecache", JSON.stringify(td)); }catch(e){ uiAlert(T("storageFail")); return; }
      location.reload();
    };
    if(state.data.cards.length > 1) uiConfirm(T("confirmLoadPre")+(td.meta.name||"知识树")+T("confirmLoadPost"), doLoadTree);
    else doLoadTree();
    return;
  }
  var arr=null;
  try{
    var j=JSON.parse(txt);
    arr = Array.isArray(j) ? j
        : (j && Array.isArray(j.cards)) ? j.cards
        : (j && j.id && j.title) ? [j] : null;
  }catch(e){
    arr=[];
    var lines=txt.split(/\r?\n/), i;
    for(i=0;i<lines.length;i++){
      var ln=lines[i].trim(); if(!ln) continue;
      try{ arr.push(JSON.parse(ln)); }catch(e2){ uiAlert(T("badLinePre")+(i+1)+T("badLinePost")+ln.slice(0,80)); }
    }
  }
  arr = sanitizeCards(arr || []);
  if(!arr.length){ uiAlert(T("noCards")); return; }
  snapshot();
  var added=0, updated=0, i, c;
  for(i=0;i<arr.length;i++){
    c=arr[i];
    if(!c || !c.id || !c.title) continue;
    if(!c.parent && c.topic){
      var tid="topic-"+c.topic;
      if(!state.byId[tid]){ state.data.cards.push({id:tid,parent:"root",stage:"",topic:c.topic,title:c.topic,core:"主题线"}); index(); }
      c.parent=tid;
    }
    if(state.byId[c.id]){ var old=state.byId[c.id]; for(var k in c) old[k]=c[k]; updated++; }
    else { state.data.cards.push(c); added++; }
    index();
  }
  markDirty(); index(); renderTree(); fit();
  uiAlert(T("impDone1")+added+T("impDone2")+updated+T("impDone3"));
}

/* MS 体例黑名单(输入/输出双侧共用,唯一来源) */
var MS_RE = /\bone mark\b|\baward(ed)? (one|1|two|2|a) mark|max\.?\s*\d|mark scheme|\baccept\s+(any|all|either|one|other)\b|\becf\b|\bowtte\b|\bcao\b|一[点步]一分|每[点步]一分|此点\S?分/i;
/* 真题/官方材料特征(输入侧强拦截):卷码、paper 编号、考季、局名、材料类型词。
   宁严勿宽——挂载输入本该是一句自己的话,命中这些词十有八九在干禁令禁止的事。 */
var EXAM_RE = /mark ?scheme|examiner'?s? report|question paper|past ?paper|specimen paper|confidential instruction|insert material|listening transcript|评分方案|评分标准|评分细则|听力原文|听力稿|试卷原文|真题|原题|考卷|(?:^|[^0-9])(?!19[0-9][0-9]|20[0-9][0-9])[0-9]{4}\s*\/\s*[0-9]{2}(?![0-9])|\b(qp|er|ci)[ _-]?[0-9]{1,2}\b|\bms[ _-][0-9]{1,2}\b/i;
function inputBlocked(s){
  /* NFKC 规范化 + 剥零宽字符 + 去空白重查:堵"插空格/零宽符拆词"的绕过 */
  s = String(s == null ? "" : s);
  try{ s = s.normalize("NFKC"); }catch(e){}
  s = s.replace(/[\u200B-\u200F\uFEFF]/g, "");
  if(EXAM_RE.test(s) || MS_RE.test(s)) return true;
  var c = s.replace(/\s+/g, "");   /* "评分 方案""m a r k scheme"去空白后再过一遍 */
  return EXAM_RE.test(c) || MS_RE.test(c);
}
function wallHit(){
  /* 输入墙命中:本次拒发(内容未离开设备)。前两次给道歉式提醒(可能是误判),
     第三次起静默停用;模型侧确认 blocked 时由调用方直接 lockout()。 */
  var n = 0, m = state.data && state.data.meta;
  try{ n = (+localStorage.getItem("notetree_wallhits")||0)+1; localStorage.setItem("notetree_wallhits", String(n)); }catch(e){}
  if(m){ m.wall_hits = (+m.wall_hits||0)+1; markDirty(); }
  var worst = Math.max(n, m ? (+m.wall_hits||0) : 0);
  var mk = document.getElementById("mask"); if(mk) mk.remove();
  if(worst >= 3){ lockout(); return; }
  uiAlert(T("wallGentle"));
}
function mountLocked(){
  /* 双源:本浏览器的记录 || 树文件自带的锁(锁跟文件走,任何设备打开都停用) */
  if(state.data && state.data.meta && state.data.meta.mount_locked) return true;
  try{ return !!localStorage.getItem("notetree_mountlock"); }catch(e){ return false; }
}
function aiEnabled(){
  /* AI 功能总开关:树文件 meta.ai_enabled(由 config 的 "ai": true 经 repack 写入)。
     默认不存在 = 整个工具没有任何 AI 入口;锁(mount_locked)优先于开关。 */
  return !!(state.data && state.data.meta && state.data.meta.ai_enabled) && !mountLocked();
}
function applyAiUI(){
  /* 开关关 → 按钮不出现;开关开但已停用 → 按钮在、外观如常,点了没反应(不置灰、不解释) */
  var b = document.getElementById("btn-mount");
  if(!b) return;
  var on = !!(state.data && state.data.meta && state.data.meta.ai_enabled);
  b.style.display = on ? "" : "none";
  b.disabled = false;
}
function aiAcked(){ try{ return localStorage.getItem("notetree_ai_ack") === "2"; }catch(e){ return false; } }
function showAiAck(){
  /* 首次启用的一次性知情确认:README 给所有人看,这一屏只砸在真正按下按钮的人脸上 */
  modal('<h2>'+T("ackTitle")+'</h2>'
    +'<div class="note" style="line-height:1.8;color:#A63A2B">'+T("ackBody")+'</div>'
    +'<label class="toggle" style="margin-top:10px"><input type="checkbox" id="ai-ack-chk">'+T("ackChk")+'</label>'
    +'<div class="btnrow" style="margin-top:12px"><button data-act="ai-ack-ok" class="primary">'+T("ackOk")+'</button><button data-act="modal-close">'+T("actCancel")+'</button></div>');
}
function lockout(){
  /* 拦截即停用,且锁写进树文件本身(meta.mount_locked):此后这份文件——含它保存
     出的一切新版本——在任何浏览器、任何设备上,挂载入口都不再出现。UI 不提供解锁。 */
  try{ localStorage.setItem("notetree_mountlock", new Date().toISOString()); }catch(e){}
  if(state.data && state.data.meta){ state.data.meta.mount_locked = new Date().toISOString(); markDirty(); }
  var mk = document.getElementById("mask"); if(mk) mk.remove();
  applyAiUI();
}
document.addEventListener("paste", function(e){
  var t=e.target;
  var editable = t && (t.tagName==="TEXTAREA" || (t.tagName==="INPUT" && t.type==="text")
    || (t.closest && t.closest("[data-title-editing],[contenteditable]")));
  if(editable){
    var txt=(e.clipboardData&&e.clipboardData.getData)?e.clipboardData.getData("text"):"";
    if(inputBlocked(txt)) uiAlert(T("pasteGuard"));
  }
});
window.addEventListener("beforeunload", function(e){
  if(state.dirty){ e.preventDefault(); e.returnValue=""; }
});
window.addEventListener("resize", function(){ /* 保持视图,无需重排 */ });

/* ============ 启动 ============ */
index();
applyFooter();
/* ---- 大树渐进折叠:叶子(卡片)节点 > 60 时,默认折叠"阶段组"层(id 形如 t00-IG,
   即 root 的孙节点)。首屏只见 root + 主题线 + 阶段组,点 +N 圆片逐层展开——
   折叠暂时不需要的知识;也避免全展开时布局超宽,fit() 把节点压成几像素的"白屏"。*/
(function(){
  var leaf=0, id;
  for(id in state.byId){ if(id!=="root" && !(state.childs[id]||[]).length) leaf++; }
  if(leaf<=60) return;
  var kids=state.childs.root||[];
  for(var i=0;i<kids.length;i++){
    var gks=state.childs[kids[i]]||[];
    for(var j=0;j<gks.length;j++){
      if((state.childs[gks[j]]||[]).length) state.collapsed[gks[j]]=1;
    }
  }
})();
document.title = (state.data.meta.name||"知识树") + T("titleSuffix");
var _bn = document.getElementById("brand-name");
if(_bn) _bn.textContent = state.data.meta.name || "知识树";
if(state.data.meta.workbench && !document.getElementById("wb-banner")){
  var wb=document.createElement("div"); wb.id="wb-banner";
  wb.style.cssText="flex:none;background:#F1EAD7;color:#2E4A5F;font-size:12px;padding:5px 14px;border-bottom:1px solid #D9CEAF;text-align:center";
  document.body.insertBefore(wb, document.getElementById("app"));
}
initApp();
renderTree();
document.getElementById("ver").textContent=" v"+(state.data.meta.version||0);
applyLang();
applyAiUI();
setTimeout(fit, 30);
})();
</script>
</body>
</html>
